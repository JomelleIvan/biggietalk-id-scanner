<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ID Scanner</title>

    <!-- QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="style(1).css">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

   
</head>

<body>

<div class="container">

    <h1>BIGGIETALK ID SCANNER</h1>

    <div id="reader"></div>

    <div id="result" class="result">

        <h2 id="resultStatus"></h2>

        <div class="row">
            <span class="label">Employee ID:</span>
            <span id="employeeId"></span>
        </div>

        <div class="row">
            <span class="label">Name:</span>
            <span id="employeeName"></span>
        </div>

        <div class="row">
            <span class="label">Platform:</span>
            <span id="employeePlatform"></span>
        </div>

        <div class="row">
            <span class="label">Department:</span>
            <span id="employeeDepartment"></span>
        </div>

        <div class="row">
            <span class="label">Status:</span>
            <span id="employeeStatus"></span>
        </div>

    </div>

</div>

<script>

    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL =
        "https://dpywkqmnhoyfqyhddiyf.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_1lafGls5ebv_WuZdhV47fA_CSu5B2Da";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // ==========================================
    // SCAN QR CODE
    // ==========================================

    async function onScanSuccess(decodedText) {

        console.log("Scanned:", decodedText);

        // Stop scanner temporarily
        await html5QrcodeScanner.clear();


        // ==========================================
        // VERIFY EMPLOYEE USING SUPABASE FUNCTION
        // ==========================================

        const { data, error } = await supabaseClient
            .rpc("verify_employee", {
                p_employee_id: decodedText
            });


        const result =
            document.getElementById("result");

        const status =
            document.getElementById("resultStatus");

        result.style.display = "block";


        // ==========================================
        // INVALID ID
        // ==========================================

        if (
            error ||
            !data ||
            data.length === 0
        ) {

            console.log(
                "Verification error:",
                error
            );

            status.textContent =
                "❌ ID NOT FOUND";

            status.className =
                "invalid";


            document.getElementById(
                "employeeId"
            ).textContent =
                decodedText;

            document.getElementById(
                "employeeName"
            ).textContent =
                "-";

            document.getElementById(
                "employeePlatform"
            ).textContent =
                "-";

            document.getElementById(
                "employeeDepartment"
            ).textContent =
                "-";

            document.getElementById(
                "employeeStatus"
            ).textContent =
                "-";


            setTimeout(
                startScanner,
                3000
            );

            return;
        }


        // ==========================================
        // VALID ID
        // ==========================================

        const employee =
            data[0];


        status.textContent =
            "✅ VALID ID";

        status.className =
            "valid";


        document.getElementById(
            "employeeId"
        ).textContent =
            employee.employee_id;


        document.getElementById(
            "employeeName"
        ).textContent =
            employee.name;


        document.getElementById(
            "employeePlatform"
        ).textContent =
            employee.platform || "-";


        document.getElementById(
            "employeeDepartment"
        ).textContent =
            employee.department || "-";


        document.getElementById(
            "employeeStatus"
        ).textContent =
            employee.status || "-";


        // Restart scanner after 3 seconds
        setTimeout(
            startScanner,
            3000
        );
    }


    // ==========================================
    // START SCANNER
    // ==========================================

    let html5QrcodeScanner;


    function startScanner() {

        document.getElementById(
            "result"
        ).style.display =
            "none";


        // Clear old reader content before restarting
        document.getElementById(
            "reader"
        ).innerHTML =
            "";


        html5QrcodeScanner =
            new Html5QrcodeScanner(

                "reader",

                {
                    fps: 10,

                    qrbox: {
                        width: 250,
                        height: 250
                    }
                },

                false
            );


        html5QrcodeScanner.render(

            onScanSuccess,

            function(errorMessage) {
                // Ignore scanning errors
            }

        );
    }


    // ==========================================
    // START SCANNER
    // ==========================================

    startScanner();

</script>

</body>
</html>
